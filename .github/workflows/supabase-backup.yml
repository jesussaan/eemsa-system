name: Supabase Weekly Backup

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Crear carpeta de backup
        run: mkdir -p backup

      # La anon key ya no puede leer select=* de pedidos (costo_pieza,
      # precio_pieza y margen_pct quedaron fuera, ver supabase_seguridad_fase1.sql)
      # -- misma lista que PEDIDOS_COLUMNAS_PUBLICAS en src/lib/constants.js.
      - name: Exportar pedidos
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/pedidos?select=id,cliente,num,tipo,medida,cajas,rollos_caja,rollos_totales,ancho,largo,color,maq,op,fecha_solicitud,fecha_inicio,fecha_termino,piezas_prod,merma,merma_pct,notas,status,created,rollos_usados,tinta_tipo,tinta_kg,alcohol_litros,notas_consumo,cliche_url,color_cinta,foto_producto_url,fecha_estimada,orden,fecha_original,inicio_ts,fin_ts,stickyback,color2,tinta_kg2,diseno,portaliche,diseno2,portaliche2,folio_rebobinado,cliche_id,tarima_jumbo_id,pausas,prioridad" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o backup/pedidos.json

      - name: Exportar producción diaria
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/prod_diaria?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o backup/prod_diaria.json

      - name: Exportar fallas
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/fallas?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o backup/fallas.json

      - name: Exportar refacciones
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/refacciones?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o backup/refacciones.json

      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
